<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1427" />
      <stop offset="50%" stop-color="#080B16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cosmicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3678E5" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3678E5" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3678E5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3678E5" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Outer Frame -->
  <rect x="2" y="2" width="396" height="276" rx="16" fill="url(#cosmicBg)" stroke="url(#cosmicBorder)" stroke-width="2" />
  
  <!-- Ambient Center Glow -->
  <circle cx="200" cy="140" r="100" fill="url(#centerGlow)" />
  
  <!-- Subtle Grid Lines -->
  <line x1="40" y1="50" x2="360" y2="50" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />
  <line x1="40" y1="230" x2="360" y2="230" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4" />
  
  <!-- Holographic Shield Icon -->
  <g transform="translate(172, 90)">
    <path d="M28 2 L52 10 V28 C52 46 28 58 28 58 C28 58 4 46 4 28 V10 L28 2 Z" 
          fill="none" 
          stroke="#3678E5" 
          stroke-width="3" 
          stroke-linejoin="round" />
    <path d="M20 28 L26 34 L38 20" 
          fill="none" 
          stroke="#8B5CF6" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
  
  <!-- Typography -->
  <text x="200" y="180" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">
    VERIFIED CREDENTIAL
  </text>
  <text x="200" y="202" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.5">
